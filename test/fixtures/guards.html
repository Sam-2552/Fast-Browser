<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guard checks</title>
    <style>
      body { margin: 30px; font: 15px system-ui, sans-serif; }
      button { width: 180px; height: 50px; }
      label { display: block; margin: 10px 0; }
      #outside { position: absolute; top: 3000px; }
    </style>
  </head>
  <body>
    <p id="context">Cart total: $10</p>
    <button id="target" onclick="window.clicks=(window.clicks||0)+1">Continue</button>
    <label>City<input id="field" value="Zurich"></label>
    <label><input id="toggle" type="checkbox">Refundable</label>
    <select id="category" aria-label="Category"><option>All</option><option>Design</option></select>
    <label>Password<input id="pw" type="password" value="hunter2"></label>
    <label>Card number<input id="card" value="4242424242424242"></label>
    <div id="host"></div>
    <p id="outside">Unrelated offscreen text</p>
    <script>
      const shadow = document.getElementById("host").attachShadow({ mode: "open" });
      shadow.innerHTML = '<button id="inner" style="width:180px;height:40px">Shadow action</button>';
      shadow.getElementById("inner").onclick = () => { window.shadowClicks = (window.shadowClicks || 0) + 1; };
    </script>
  </body>
</html>
